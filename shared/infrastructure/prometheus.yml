# ==============================================================================
# File: shared/infrastructure/prometheus.yml
# Purpose: Scrape the OTEL collector Prometheus exporter and self-metrics.
#          k6 can also remote-write to http://localhost:9090/api/v1/write
#          (compose enables --web.enable-remote-write-receiver).
# SOLID: SRP — scrape config only; dashboards live in Grafana.
# ==============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: omnitest-polyglot-nexus

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          source: otel

  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          source: otel-internal

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
