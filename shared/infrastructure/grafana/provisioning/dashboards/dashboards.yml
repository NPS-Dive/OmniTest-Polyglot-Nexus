# ==============================================================================
# File: shared/infrastructure/grafana/provisioning/dashboards/dashboards.yml
# Purpose: Load JSON dashboards from /var/lib/grafana/dashboards (compose mount).
# SOLID: SRP — provider registration only; panel JSON lives beside this folder.
# ==============================================================================
apiVersion: 1

providers:
  - name: OmniTest
    orgId: 1
    folder: OmniTest
    folderUid: opn
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
