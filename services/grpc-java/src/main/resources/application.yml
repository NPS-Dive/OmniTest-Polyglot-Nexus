# ==============================================================================
# File: services/grpc-java/src/main/resources/application.yml
# Purpose: Spring Boot, JDBC datasource, and gRPC listen port.
# SOLID: SRP — configuration only. Schema is owned by data/vector-store SQL
#        (ddl-auto is not used; JPA is not on the classpath).
# Note: Targets persons_java only. Env vars match docker-compose opn_db.
# ==============================================================================

server:
  port: ${HTTP_PORT:8083}

spring:
  application:
    name: ${OTEL_SERVICE_NAME:grpc-java}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:${POSTGRES_DATABASE:opn_db}}?sslmode=${POSTGRES_SSLMODE:disable}
    username: ${POSTGRES_USER:opn_admin}
    password: ${POSTGRES_PASSWORD:opn_secret}
    driver-class-name: org.postgresql.Driver

# gRPC Server Configuration (net.devh.boot.grpc). PORT overrides the locked 50053.
grpc:
  server:
    port: ${PORT:50053}
    reflection-service-enabled: true
